<!doctype html>
<!-- Thumbnail (1280x720). params: bg, words ["IT'S A", "DRUG"], accent ["DRUG"], focus "70% 55%" (crop focus), zoom 1.6 -->
<html><head><meta charset="utf-8"><script src="lib.js"></script>
<style>
 html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}
 #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
 #shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.55) 38%,rgba(0,0,0,0) 62%)}
 #t{position:absolute;left:56px;top:50%;transform:translateY(-50%) rotate(-2deg);font:900 168px/0.92 'Inter Display',sans-serif;
    color:#f2eae2;letter-spacing:-0.02em;text-shadow:0 8px 0 #000,0 0 40px rgba(0,0,0,.9);-webkit-text-stroke:3px #000}
 #t span{display:block}
</style></head><body>
<img id="bg"><div id="shade"></div><div id="t"></div>
<script>
 const bg=document.getElementById('bg'); bg.src=param('bg');
 bg.style.objectPosition=param('focus','70% 55%'); bg.style.transform=`scale(${param('zoom',1.6)})`;
 bg.style.transformOrigin=param('focus','70% 55%');
 const acc=new Set(param('accent',[]));
 document.getElementById('t').innerHTML=param('words',[]).map(w=>`<span style="color:${acc.has(w)?BRAND.accent:''}">${w}</span>`).join('');
 window.sceneReady=()=>imagesReady(); window.renderFrame=()=>{};
</script></body></html>
